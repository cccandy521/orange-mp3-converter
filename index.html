<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f28c28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="橘子MP3">
<link rel="manifest" href="manifest.webmanifest?v=13">
<link rel="icon" href="icon.svg?v=13" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=13">
<title>橘子 MP3 批次轉檔器</title>
<style>
:root{--bg:#fff8f1;--card:#fff;--o:#f28c28;--o2:#ffb36f;--txt:#292929;--muted:#777;--line:#efd4bc;--green:#267a4d}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#fff8f1,#fffdf9);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:var(--txt)}
main{max-width:720px;margin:auto;padding:22px 16px 46px}
.pill{display:inline-block;background:#fff0e3;color:#c36b18;border-radius:999px;padding:7px 12px;font-size:14px}
h1{font-size:34px;line-height:1.12;margin:6px 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 8px 28px rgba(160,103,45,.08)}
.step{font-weight:800;color:#b85e0a;margin:2px 0 10px;font-size:15px}
.pick{display:block;border:2px dashed var(--o2);border-radius:18px;padding:22px 14px;text-align:center;background:#fffaf5;cursor:pointer}
.pick b{display:block;font-size:19px}.pick span{color:var(--muted);font-size:14px;line-height:1.6}
input[type=file]{position:absolute;left:-9999px}
.row{margin-top:18px}label.txt{display:block;margin-bottom:8px;font-size:17px}
select,button{width:100%;border-radius:16px;padding:14px 15px;font-size:18px}
select{border:1px solid #e6c3a5;background:#fff}
button{border:0;font-weight:800}
.primary{background:linear-gradient(#ffbf8b,#ffa55f);color:#fff;margin-top:14px}
.save{background:linear-gradient(#45a66d,#2e8757);color:#fff;margin-top:12px}
button:disabled{opacity:.42}
.summary{margin:14px 2px 4px;color:#76685b;font-size:14px}
.item{border:1px solid #edd8c5;border-radius:16px;padding:12px 13px;margin-top:10px;background:#fffdfa}
.name{font-weight:800;word-break:break-all}.meta,.status{font-size:13px;color:#777;margin-top:5px}
.progress{height:8px;background:#f2e6da;border-radius:99px;overflow:hidden;margin-top:9px}
.bar{height:100%;background:var(--o);width:0;transition:width .2s}
.actions{display:flex;gap:8px;margin-top:9px}.actions button{font-size:14px;padding:9px}
.rm{background:#fff2f0;color:#994236;border:1px solid #efcbc5}
.notice{margin-top:10px;font-size:13px;line-height:1.6;color:#777;text-align:center;background:none;border:0;padding:0}
.note{margin-top:16px;font-size:13px;line-height:1.7;color:#76685b}
.install{margin-top:18px;padding:15px;border-radius:18px;background:#fff5ea;border:1px solid #efd5bb;line-height:1.65;font-size:14px}
.install b{color:#b45d0d}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>MP3 轉檔器</h1>


<section class="card">
<div class="step">① 選擇音檔</div>
<label class="pick" for="files">
  <b>支援 M4A、AAC、WAV 音檔</b>
</label>
<input id="files" type="file" accept=".m4a,.aac,.wav,audio/*" multiple>
<div id="summary" class="summary">尚未選擇檔案。</div>
<div id="list"></div>

<div class="row">
  <div class="step">② MP3 音質</div>
  <select id="rate">
    <option value="128">128 kbps（檔案較小）</option>
    <option value="192" selected>192 kbps（推薦：詩班練唱）</option>
    <option value="256">256 kbps（高音質）</option>
    <option value="320">320 kbps（最高常用音質）</option>
  </select>
</div>
<div class="step" style="margin-top:18px">③ 全部轉檔</div><button id="go" class="primary" disabled>全部轉成 MP3</button>

<div id="saveArea" class="hidden">
  
  <button id="saveAll" class="save">儲存全部 MP3</button>
  <div id="saveStatus" class="notice">會開啟 iPhone 儲存畫面，可選擇 iCloud Drive 或「我的 iPhone」。</div>
</div>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js?v=13').catch(()=>{});

const f=document.getElementById('files');
const go=document.getElementById('go');
const list=document.getElementById('list');
const summary=document.getElementById('summary');
const rate=document.getElementById('rate');
const saveArea=document.getElementById('saveArea');
const saveAll=document.getElementById('saveAll');
const saveStatus=document.getElementById('saveStatus');

let entries=[];
let busy=false;

const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const base=n=>n.replace(/\.[^.]+$/,'');
const sz=n=>n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';

function render(){
  list.innerHTML='';
  entries.forEach((e,i)=>{
    const d=document.createElement('div');
    d.className='item';
    d.innerHTML=
      '<div class="name">'+esc(e.file.name)+'</div>'+
      ((e.p||0)>0 ? '<div class="progress"><div class="bar" id="b'+i+'" style="width:'+(e.p||0)+'%"></div></div><div class="status" id="s'+i+'">'+esc(e.status||'')+'</div>' : '')+
      '<div class="actions"><button class="rm" id="r'+i+'" '+(busy?'disabled':'')+'>移除</button></div>';
    list.appendChild(d);
    d.querySelector('#r'+i).onclick=()=>{
      if(e.url)URL.revokeObjectURL(e.url);
      entries.splice(i,1);
      saveArea.classList.add('hidden');
      render();
    };
  });
  go.disabled=busy||!entries.length;
  summary.textContent=entries.length
    ? '已選擇 '+entries.length+' 個檔案'
    : '尚未選擇檔案';
}

f.addEventListener('change',()=>{
  for(const file of f.files){
    if(!entries.some(e=>e.file.name===file.name&&e.file.size===file.size)){
      entries.push({file,status:'等待轉檔',p:0,blob:null,url:null});
    }
  }
  f.value='';
  saveArea.classList.add('hidden');
  render();
});

function prog(i,p,msg){
  entries[i].p=p;
  entries[i].status=msg;
  const b=document.getElementById('b'+i),s=document.getElementById('s'+i);
  if(b)b.style.width=p+'%';
  if(s)s.textContent=msg;
}

async function decode(file){
  const ab=await file.arrayBuffer();
  const C=window.AudioContext||window.webkitAudioContext;
  const c=new C();
  try{
    const a=await c.decodeAudioData(ab.slice(0));
    const ch=[];
    for(let i=0;i<a.numberOfChannels;i++)ch.push(a.getChannelData(i));
    return {ch,sr:a.sampleRate};
  }finally{
    try{await c.close()}catch(e){}
  }
}

function pcm16(x){
  const o=new Int16Array(x.length);
  for(let i=0;i<x.length;i++){
    const s=Math.max(-1,Math.min(1,x[i]));
    o[i]=s<0?s*32768:s*32767;
  }
  return o;
}

async function encode(p,br,cb){
  if(typeof lamejs==='undefined')throw new Error('轉檔元件未載入，請確認網路後重新整理。');
  const n=Math.min(2,p.ch.length);
  const L=pcm16(p.ch[0]);
  const R=n===2?pcm16(p.ch[1]):null;
  const enc=new lamejs.Mp3Encoder(n,p.sr,br);
  const out=[],step=1152;
  for(let i=0;i<L.length;i+=step){
    const l=L.subarray(i,i+step),r=R&&R.subarray(i,i+step);
    const buf=n===2?enc.encodeBuffer(l,r):enc.encodeBuffer(l);
    if(buf.length)out.push(new Int8Array(buf));
    if(i%(step*80)===0){
      cb(Math.round(i/L.length*95));
      await new Promise(r=>setTimeout(r,0));
    }
  }
  const end=enc.flush();
  if(end.length)out.push(new Int8Array(end));
  cb(100);
  return new Blob(out,{type:'audio/mpeg'});
}

go.onclick=async()=>{
  summary.textContent='開始轉檔，請稍候…';
  busy=true;
  saveArea.classList.add('hidden');
  render();
  const br=+rate.value;
  let ok=0;

  for(let i=0;i<entries.length;i++){
    try{
      prog(i,3,'讀取與解碼中…');
      const p=await decode(entries[i].file);
      prog(i,8,'轉檔中…');
      const blob=await encode(p,br,x=>prog(i,8+Math.round(x*.9),'轉檔中…'));
      if(entries[i].url)URL.revokeObjectURL(entries[i].url);
      entries[i].blob=blob;
      entries[i].url=URL.createObjectURL(blob);
      entries[i].status='完成，等待一起儲存';
      entries[i].p=100;
      ok++;
      render();
    }catch(err){
      entries[i].blob=null;
      prog(i,0,'失敗：'+(err.message||err));
    }
  }

  busy=false;
  render();
  summary.textContent='已完成 '+ok+' 個 MP3';
  if(ok>0){
    saveArea.classList.remove('hidden');
    setTimeout(()=>saveArea.scrollIntoView({behavior:'smooth',block:'center'}),100);
  }
};

saveAll.onclick=async()=>{
  const done=entries.filter(e=>e.blob);
  if(!done.length){
    saveStatus.textContent='目前沒有可儲存的 MP3，請先完成轉檔。';
    return;
  }

  saveStatus.textContent='正在準備 iPhone 儲存畫面…';

  const files=done.map(e=>new File([e.blob],base(e.file.name)+'.mp3',{type:'audio/mpeg'}));
  const data={files};

  // iPhone Safari/WebKit sometimes reports canShare inconsistently.
  // Try native multi-file share first, directly from this user click.
  if(navigator.share){
    try{
      const r=navigator.share(data);
      if(r && typeof r.then==='function') await r;
      saveStatus.textContent='已開啟 iPhone 分享畫面。請選「儲存到檔案」，再選你要的資料夾。';
      return;
    }catch(err){
      if(err && err.name==='AbortError'){
        saveStatus.textContent='你已取消。MP3 還在頁面裡，可再按一次儲存。';
        return;
      }
      saveStatus.textContent='iPhone 無法一次分享多個 MP3，正在改用相容模式…';
    }
  }

  // Reliable fallback: one ZIP, then Save to Files. User can tap once in Files to unzip.
  try{
    if(typeof JSZip==='undefined') throw new Error('備用元件尚未載入');
    const zip=new JSZip();
    done.forEach(e=>zip.file(base(e.file.name)+'.mp3',e.blob));
    const blob=await zip.generateAsync({type:'blob'});
    const file=new File([blob],'橘子MP3_批次轉檔.zip',{type:'application/zip'});
    if(navigator.share){
      try{
        const r=navigator.share({files:[file]});
        if(r && typeof r.then==='function') await r;
        saveStatus.textContent='已改用相容模式。請選「儲存到檔案」；存好後在「檔案」App 點 ZIP 一下即可解壓成全部 MP3。';
        return;
      }catch(err){
        if(err && err.name==='AbortError'){
          saveStatus.textContent='你已取消儲存。';
          return;
        }
      }
    }
    const u=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=u; a.download='橘子MP3_批次轉檔.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),30000);
    saveStatus.textContent='已下載備用 ZIP 到 Safari 下載資料夾。';
  }catch(err){
    saveStatus.textContent='儲存失敗：'+(err.message||err);
    alert('儲存失敗：'+(err.message||err));
  }
};


render();
</script>
</body>
</html>
